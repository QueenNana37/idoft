name: Confirm Flaky Test
on:
  push:
  workflow_dispatch:
jobs:
  confirm-flaky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MapStruct
        uses: actions/checkout@v4
        with:
          repository: mapstruct/mapstruct
          path: mapstruct

      - name: Set up Java 21 (compile)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile MapStruct with Java 21
        run: |
          cd mapstruct
          mvn clean install -DskipTests -pl processor -am \
            -Dlicense.skip=true \
            -Danimal.sniffer.skip=true \
            -Dmaven.compiler.source=11 \
            -Dmaven.compiler.target=11

      - name: Set up Java 11 (NonDex)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run test normally (Expected PASS)
        run: |
          cd mapstruct
          mvn -pl processor test \
            -Dtest=org.mapstruct.ap.test.conversion.java8time.Java8TimeConversionTest#testLocalTimeToString \
            -Dlicense.skip=true

      - name: Run test with NonDex (Expected FAIL)
        continue-on-error: true
        run: |
          cd mapstruct
          mvn -pl processor edu.illinois:nondex-maven-plugin:2.1.1:nondex \
            -Dtest=org.mapstruct.ap.test.conversion.java8time.Java8TimeConversionTest#testLocalTimeToString \
            -DnondexRuns=10
