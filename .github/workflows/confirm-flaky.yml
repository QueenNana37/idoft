name: Confirm Flaky Test

on: [push, workflow_dispatch]

jobs:
  confirm-flaky:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Clone mapstruct
        run: git clone https://github.com/mapstruct/mapstruct.git

      - name: Compile mapstruct (skip checkstyle)
        run: |
          cd mapstruct
          mvn clean install -DskipTests -pl processor -am \
            -Dcheckstyle.skip=true \
            -Dmaven.checkstyle.skip=true \
            -Dlicense.skip=true \
            -Danimal.sniffer.skip=true

      - name: Run test normally (should PASS)
        run: |
          cd mapstruct
          mvn -pl processor test \
            -Dtest=org.mapstruct.ap.test.conversion.java8time.Java8TimeConversionTest#testLocalTimeToString \
            -Dcheckstyle.skip=true -Dlicense.skip=true

      - name: Run test with NonDex (should FAIL)
        run: |
          cd mapstruct
          mvn -pl processor edu.illinois:nondex-maven-plugin:2.1.1:nondex \
            -Dtest=org.mapstruct.ap.test.conversion.java8time.Java8TimeConversionTest#testLocalTimeToString \
            -DnondexRuns=10


- name: Compile MapStruct with Java 11
        run: |
          cd mapstruct
          git checkout 26c5bcd923c7206ad161e93237f841a79ca85efd
          mvn clean install -DskipTests -pl processor -am \
            -Dlicense.skip=true \
            -Danimal.sniffer.skip=true \
            -Dcheckstyle.skip=true
